name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Style checks give the same answer on every OS and Node version, so run them once.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run lint && npm run format:check
      - run: npm run build
      - run: npm test
      # Runs the built CLI end to end against the fake Olostep, so CI never holds a real key.
      - run: npm run smoke
